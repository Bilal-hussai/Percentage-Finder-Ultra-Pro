<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultra Smooth Percentage Calculator</title>

<style>
:root{
    --bg:#0b0b0b;
    --card:#111;
    --input:#000;
    --border:#1f1f1f;
    --green:#22c55e;
    --red:#ef4444;
}
*{box-sizing:border-box}

body{
    margin:0;
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.calculator{
    width:100%;
    max-width:420px;
    background:var(--card);
    border-radius:18px;
    padding:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.7);
}

h2{
    margin:0 0 18px;
    color:#fff;
    text-align:center;
    font-size:20px;
}

.group{
    margin-bottom:14px;
}

label{
    font-size:12px;
    color:#9ca3af;
    display:block;
    margin-bottom:6px;
}

input{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--input);
    color:#fff;
    font-size:16px;
    outline:none;
}

input:focus{border-color:#6366f1}

.result{
    margin-top:20px;
    background:#000;
    border-radius:14px;
    padding:20px;
    text-align:center;
}

.result span{
    font-size:12px;
    color:#9ca3af;
}

.result strong{
    display:block;
    margin-top:6px;
    font-size:32px;
    font-weight:600;
    will-change:contents;
}
</style>
</head>

<body>

<div class="calculator">
    <h2>Percentage Difference</h2>

    <div class="group">
        <label>First Amount</label>
        <input id="oldVal" type="number" inputmode="decimal">
    </div>

    <div class="group">
        <label>Second Amount</label>
        <input id="newVal" type="number" inputmode="decimal">
    </div>

    <div class="result">
        <span>Result</span>
        <strong id="output">0.00%</strong>
    </div>
</div>

<script>
const oldVal = document.getElementById("oldVal");
const newVal = document.getElementById("newVal");
const output = document.getElementById("output");

let current = 0;
let target = 0;
let start = null;
const duration = 280; // ultra fast

function animate(ts){
    if(!start) start = ts;
    const progress = Math.min((ts - start) / duration, 1);

    // smooth spring-like ease
    const eased = 1 - Math.pow(1 - progress, 4);
    current = current + (target - current) * eased;

    output.textContent = current.toFixed(2) + "%";
    output.style.color = target >= 0 ? "#22c55e" : "#ef4444";

    if(progress < 1){
        requestAnimationFrame(animate);
    }else{
        current = target;
        output.textContent = target.toFixed(2) + "%";
        start = null;
    }
}

function calculate(){
    const a = parseFloat(oldVal.value);
    const b = parseFloat(newVal.value);

    if(!a || !b){
        target = 0;
        requestAnimationFrame(animate);
        return;
    }

    target = ((b - a) / a) * 100;
    requestAnimationFrame(animate);
}

oldVal.addEventListener("input", calculate);
newVal.addEventListener("input", calculate);
</script>

</body>
</html>
